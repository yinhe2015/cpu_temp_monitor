<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU核心温度曲线监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            color: #eee;
            padding: 20px;
            font-family: system-ui, sans-serif;
        }
        .container {
            max-width: 100%;
            overflow-x: auto;
        }
        #chartWrap {
            width: 1600px;
            height: 700px;
            position: relative;
        }
        h1 {
            font-size: 22px;
        }
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .switch-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .switch-control input {
            width: 17px;
            height: 17px;
            accent-color: #33b5e5;
        }
        .select-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .select-control select {
            padding: 5px 8px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
        }
        details.core-filter {
            position: relative;
        }
        details.core-filter > summary {
            padding: 5px 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .core-options {
            position: absolute;
            z-index: 10;
            top: calc(100% + 6px);
            right: 0;
            min-width: 150px;
            max-height: 360px;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #242424;
            box-shadow: 0 6px 20px #0009;
        }
        .core-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 7px;
            margin-bottom: 5px;
            border-bottom: 1px solid #444;
        }
        .core-actions button {
            flex: 1;
            padding: 3px 6px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            cursor: pointer;
        }
        .core-option {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 3px;
            cursor: pointer;
            white-space: nowrap;
        }
        .core-option input {
            accent-color: #33b5e5;
        }
        .zoom-tip {
            color: #aaa;
            white-space: nowrap;
        }
        @media (max-width: 700px) {
            .title-bar {
                align-items: flex-start;
                flex-direction: column;
            }
            .controls {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <h1>CPU核心温度实时曲线</h1>
        <div class="controls">
            <span class="zoom-tip">滚轮缩放，双击恢复</span>
            <label class="select-control">
                <span>滚轮缩放</span>
                <select id="zoomDirection">
                    <option value="x" selected>横向（时间）</option>
                    <option value="y">竖向（温度）</option>
                    <option value="none">无（关闭）</option>
                </select>
            </label>
            <details class="core-filter">
                <summary id="coreFilterSummary">显示温度</summary>
                <div class="core-options" id="coreOptions">
                    <div class="core-actions">
                        <button type="button" id="showAllCores">全选</button>
                        <button type="button" id="hideAllCores">全不选</button>
                    </div>
                    <div id="coreOptionList"></div>
                </div>
            </details>
            <label class="switch-control">
                <input type="checkbox" id="showDate">
                <span>显示年月日</span>
            </label>
        </div>
    </div>
    <div class="container">
        <div id="chartWrap">
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <script>
        // 配色方案，足够多核心使用
        const colorList = [
            '#ff4444','#ffbb33','#00C851','#33b5e5','#aa66cc',
            '#ff8800','#0099cc','#cc0066','#99cc00','#669900',
            '#00cccc','#ff6699','#9966ff','#66ffcc','#ffcc66'
        ];

        async function loadData() {
            try {
                const res = await fetch('/data');
                const text = await res.text();
                parseCSV(text);
            } catch (err) {
                console.error("加载/data失败", err);
                alert("无法获取 /data 数据，请检查接口");
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if(lines.length < 2) return alert("数据为空");

            const header = lines[0].split(',');
            const rows = lines.slice(1);

            // 自动提取所有核心列
            const coreCols = [];
            header.forEach((name, idx) => {
                if(name.startsWith('核心') && name.includes('温度')){
                    coreCols.push({
                        index: idx,
                        label: name.replace('温度','').trim()
                    });
                }
            });
            const coreCount = coreCols.length;
            console.log("自动识别核心数量：", coreCount, coreCols);

            // 组装图表数据
            const datasets = [];
            const timeLabels = [];
            const coreDataMap = {};
            coreCols.forEach(item=> coreDataMap[item.label] = []);

            for(const line of rows){
                const cols = line.split(',');
                const timeStr = cols[0];
                timeLabels.push(timeStr);

                for(const item of coreCols){
                    const val = parseFloat(cols[item.index]);
                    coreDataMap[item.label].push(isNaN(val)?null:val);
                }
            }

            // 构建Chart数据集
            coreCols.forEach((item, idx)=>{
                const color = colorList[idx % colorList.length];
                datasets.push({
                    label: item.label,
                    data: coreDataMap[item.label],
                    borderColor: color,
                    backgroundColor: color + '33',
                    borderWidth: 2,
                    pointRadius: 1.5,
                    tension: 0.2,
                    fill: false
                })
            })

            renderChart(timeLabels, datasets);
        }

        let chartInstance = null;

        function formatTimeLabel(value, includeDate) {
            const text = String(value ?? '').trim();
            const match = text.match(/(?:(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?\s+)?(\d{1,2}:\d{2}:\d{2})/);
            if (!match) return text;
            if (!includeDate || !match[1]) return match[4];
            return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')} ${match[4]}`;
        }

        function updateCoreFilterSummary() {
            const total = chartInstance?.data.datasets.length || 0;
            const visible = chartInstance?.data.datasets.filter((_, index) =>
                chartInstance.isDatasetVisible(index)
            ).length || 0;
            document.getElementById('coreFilterSummary').textContent =
                `显示温度（${visible}/${total}）`;
        }

        function getTemperatureRange(datasets, onlyVisible = false) {
            let min = Infinity;
            let max = -Infinity;
            datasets.forEach((dataset, index) => {
                if (onlyVisible && !chartInstance.isDatasetVisible(index)) return;
                dataset.data.forEach(value => {
                    const number = Number(value);
                    if (!Number.isFinite(number)) return;
                    min = Math.min(min, number);
                    max = Math.max(max, number);
                });
            });

            if (!Number.isFinite(min) || !Number.isFinite(max)) {
                return {min: 0, max: 100};
            }

            min = Math.floor(min);
            max = Math.ceil(max);
            if (min === max) {
                min -= 1;
                max += 1;
            }
            return {min, max};
        }

        function applyVisibleTemperatureRange(updateMode) {
            if (!chartInstance) return;
            const range = getTemperatureRange(chartInstance.data.datasets, true);
            chartInstance.options.scales.y.min = range.min;
            chartInstance.options.scales.y.max = range.max;
            chartInstance.update(updateMode);
        }

        function setDatasetVisibility(index, visible) {
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            chartInstance.setDatasetVisibility(index, visible);
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
        }

        function buildCoreFilter(datasets) {
            const list = document.getElementById('coreOptionList');
            list.replaceChildren();

            datasets.forEach((dataset, index) => {
                const label = document.createElement('label');
                label.className = 'core-option';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.dataset.datasetIndex = index;
                checkbox.addEventListener('change', () =>
                    setDatasetVisibility(index, checkbox.checked)
                );

                const color = document.createElement('span');
                color.textContent = '●';
                color.style.color = dataset.borderColor;

                const text = document.createElement('span');
                text.textContent = dataset.label;

                label.append(checkbox, color, text);
                list.appendChild(label);
            });
            updateCoreFilterSummary();
        }

        function renderChart(labels, datasets){
            const ctx = document.getElementById('tempChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            const temperatureRange = getTemperatureRange(datasets);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {display:true, text:"温度 ℃", color:"#eee"},
                            min: temperatureRange.min,
                            max: temperatureRange.max,
                            ticks: {color:"#ddd"},
                            grid: {color:"#333"}
                        },
                        x: {
                            title: {display:true, text:"时间", color:"#eee"},
                            ticks: {
                                color:"#ddd",
                                maxRotation: 45,
                                minRotation:45,
                                callback: function(value) {
                                    const rawLabel = this.getLabelForValue(value);
                                    return formatTimeLabel(
                                        rawLabel,
                                        document.getElementById('showDate').checked
                                    );
                                }
                            },
                            grid: {color:"#333"}
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: function(items) {
                                    if (!items.length) return '';
                                    return formatTimeLabel(
                                        items[0].label,
                                        document.getElementById('showDate').checked
                                    );
                                }
                            }
                        },
                        zoom: {
                            zoom: {
                                wheel: {
                                    enabled: true,
                                    speed: 0.08
                                },
                                mode: document.getElementById('zoomDirection').value
                            },
                            limits: {
                                x: {minRange: 5},
                                y: {minRange: 1}
                            }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
            buildCoreFilter(datasets);
        }

        document.getElementById('showDate').addEventListener('change', () => {
            chartInstance?.update();
        });

        document.getElementById('zoomDirection').addEventListener('change', event => {
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            applyVisibleTemperatureRange('none');
            const direction = event.target.value;
            chartInstance.options.plugins.zoom.zoom.wheel.enabled = direction !== 'none';
            chartInstance.options.plugins.zoom.zoom.mode =
                direction === 'none' ? 'x' : direction;
            chartInstance.update();
        });

        document.getElementById('showAllCores').addEventListener('click', () => {
            chartInstance?.resetZoom('none');
            document.querySelectorAll('#coreOptionList input').forEach((checkbox, index) => {
                checkbox.checked = true;
                chartInstance?.setDatasetVisibility(index, true);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
        });

        document.getElementById('hideAllCores').addEventListener('click', () => {
            chartInstance?.resetZoom('none');
            document.querySelectorAll('#coreOptionList input').forEach((checkbox, index) => {
                checkbox.checked = false;
                chartInstance?.setDatasetVisibility(index, false);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
        });

        document.getElementById('tempChart').addEventListener('dblclick', () => {
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            applyVisibleTemperatureRange();
        });

        // 启动加载
        window.onload = loadData;
    </script>
</body>
</html>
