<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU核心温度曲线监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            color: #eee;
            padding: 20px;
            font-family: system-ui, sans-serif;
        }
        .container {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        #chartWrap {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .chart-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 16px;
            grid-template-rows: 700px 16px;
            width: 100%;
            min-width: 0;
        }
        .horizontal-scroll {
            grid-column: 1;
            grid-row: 2;
            overflow-x: scroll;
            overflow-y: hidden;
        }
        .vertical-scroll {
            grid-column: 2;
            grid-row: 1;
            overflow-x: hidden;
            overflow-y: scroll;
        }
        .scroll-spacer {
            width: 1px;
            height: 1px;
            pointer-events: none;
        }
        .horizontal-scroll,
        .vertical-scroll {
            scrollbar-color: #777 #333;
        }
        .chart-tooltip {
            position: absolute;
            z-index: 20;
            min-width: 150px;
            padding: 9px 11px;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 6px;
            background: #202020ee;
            box-shadow: 0 5px 18px #0009;
            pointer-events: none;
            transform: translate(-50%, calc(-100% - 10px));
            transition: opacity 80ms ease;
        }
        .chart-tooltip-title {
            margin-bottom: 6px;
            color: #fff;
        }
        .chart-tooltip-row {
            display: flex;
            align-items: center;
            gap: 7px;
            line-height: 1.55;
        }
        .chart-tooltip-row.is-active {
            color: #fff;
            font-weight: 700;
        }
        .chart-tooltip-icon {
            width: 9px;
            height: 9px;
            flex: 0 0 9px;
            border-radius: 50%;
            box-shadow: 0 0 0 1px #ffffff55;
        }
        .chart-tooltip-row.is-active .chart-tooltip-icon {
            transform: scale(1.45);
            box-shadow: 0 0 7px 2px currentColor;
        }
        h1 {
            font-size: 22px;
        }
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .switch-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .switch-control input {
            width: 17px;
            height: 17px;
            accent-color: #33b5e5;
        }
        .select-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .select-control select {
            padding: 5px 8px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
        }
        .control-button {
            padding: 5px 11px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
        }
        .control-button:disabled {
            opacity: 0.55;
            cursor: wait;
        }
        details.core-filter {
            position: relative;
        }
        details.core-filter > summary {
            padding: 5px 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .core-options {
            position: absolute;
            z-index: 10;
            top: calc(100% + 6px);
            right: 0;
            min-width: 150px;
            max-height: 360px;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #242424;
            box-shadow: 0 6px 20px #0009;
        }
        .core-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 7px;
            margin-bottom: 5px;
            border-bottom: 1px solid #444;
        }
        .core-actions button {
            flex: 1;
            padding: 3px 6px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            cursor: pointer;
        }
        .core-option {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 3px;
            cursor: pointer;
            white-space: nowrap;
        }
        .core-option input {
            accent-color: #33b5e5;
        }
        .zoom-tip {
            color: #aaa;
            white-space: nowrap;
        }
        @media (max-width: 700px) {
            .title-bar {
                align-items: flex-start;
                flex-direction: column;
            }
            .controls {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <h1>CPU核心温度曲线</h1>
        <div class="controls">
            <span class="zoom-tip">滚轮缩放，双击恢复</span>
            <label class="select-control">
                <span>滚轮缩放</span>
                <select id="zoomDirection">
                    <option value="x" selected>横向（时间）</option>
                    <option value="y">竖向（温度）</option>
                    <option value="none">无（关闭）</option>
                </select>
            </label>
            <details class="core-filter">
                <summary id="coreFilterSummary">显示温度</summary>
                <div class="core-options" id="coreOptions">
                    <div class="core-actions">
                        <button type="button" id="showAllCores">全选</button>
                        <button type="button" id="hideAllCores">全不选</button>
                    </div>
                    <div id="coreOptionList"></div>
                </div>
            </details>
            <label class="switch-control">
                <input type="checkbox" id="showDate">
                <span>显示年月日</span>
            </label>
            <button type="button" class="control-button" id="refreshData">刷新</button>
        </div>
    </div>
    <div class="chart-layout">
        <div class="container" id="chartViewport">
            <div id="chartWrap">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
        <div class="vertical-scroll" id="verticalScroll" aria-label="温度范围滚动条">
            <div class="scroll-spacer" id="verticalScrollSpacer"></div>
        </div>
        <div class="horizontal-scroll" id="horizontalScroll" aria-label="时间范围滚动条">
            <div class="scroll-spacer" id="horizontalScrollSpacer"></div>
        </div>
    </div>

    <script>
        // 配色方案，足够多核心使用
        const colorList = [
            '#ff4444','#ffbb33','#00C851','#33b5e5','#aa66cc',
            '#ff8800','#0099cc','#cc0066','#99cc00','#669900',
            '#00cccc','#ff6699','#9966ff','#66ffcc','#ffcc66'
        ];

        let totalRecords = 0;
        let temperatureCols = [];
        let loadedStart = 0;
        let loadedEnd = 0;
        let rangeRequestId = 0;
        let rangeLoadTimer = null;
        let webSocket = null;
        let webSocketReconnectTimer = null;
        let pendingRealtimeMessages = [];
        const timeByIndex = new Map();

        function parseTemperatureColumns(header) {
            const columns = [];
            header.forEach((rawName, index) => {
                if (index === 0) return;
                const name = String(rawName).replace(/^\uFEFF/, '').trim();
                const isMain = name.includes('总温度') || name.includes('主温度');
                const isCore = /^核心\s*\d+(?:温度)?$/.test(name);
                if (isMain || isCore) {
                    columns.push({
                        index,
                        label: isMain
                            ? '总温度（主温度）'
                            : name.replace(/温度$/, '').replace(/\s+/g, '')
                    });
                }
            });
            return columns;
        }

        function createDatasets(rows) {
            return temperatureCols.map((column, datasetIndex) => {
                const color = colorList[datasetIndex % colorList.length];
                return {
                    label: column.label,
                    data: rows.map(row => {
                        const rawValue = row.values[column.index];
                        const value = rawValue === '' ? NaN : Number(rawValue);
                        return {
                            x: row.index,
                            y: Number.isFinite(value) ? value : null
                        };
                    }),
                    borderColor: color,
                    backgroundColor: color + '33',
                    borderWidth: 2,
                    pointRadius: 1.5,
                    tension: 0.2,
                    fill: false
                };
            });
        }

        function rememberTimes(rows) {
            timeByIndex.clear();
            rows.forEach(row => timeByIndex.set(row.index, row.values[0]));
        }

        async function requestRange(start, limit) {
            const response = await fetch(
                `/data/range?start=${start}&limit=${limit}`,
                {cache: 'no-store'}
            );
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        async function loadData() {
            const refreshButton = document.getElementById('refreshData');
            refreshButton.disabled = true;
            refreshButton.textContent = '刷新中…';
            try {
                const metaResponse = await fetch('/data/meta', {cache: 'no-store'});
                if (!metaResponse.ok) throw new Error(`HTTP ${metaResponse.status}`);
                const meta = await metaResponse.json();
                totalRecords = Math.max(0, Number(meta.total) || 0);
                temperatureCols = parseTemperatureColumns(
                    Array.isArray(meta.header) ? meta.header : []
                );
                if (!temperatureCols.length) {
                    throw new Error('CSV 中没有可识别的温度列');
                }

                const viewportWidth =
                    document.getElementById('chartViewport').clientWidth ||
                    window.innerWidth;
                const visibleCount = Math.max(12, Math.floor(viewportWidth / 22));
                const fetchCount = Math.min(
                    5000,
                    Math.max(visibleCount * 3, 200)
                );
                const start = Math.max(0, totalRecords - fetchCount);
                const range = await requestRange(start, fetchCount);
                totalRecords = Math.max(totalRecords, Number(range.total) || 0);
                loadedStart = start;
                loadedEnd = start + range.rows.length;
                rememberTimes(range.rows);
                const datasets = createDatasets(range.rows);
                renderChart(datasets, visibleCount);
            } catch (err) {
                console.error('加载温度数据失败', err);
                alert('无法获取温度数据，请检查服务端');
            } finally {
                refreshButton.disabled = false;
                refreshButton.textContent = '刷新';
            }
        }

        function scheduleVisibleRangeLoad() {
            clearTimeout(rangeLoadTimer);
            rangeLoadTimer = setTimeout(loadVisibleRange, 120);
        }

        async function loadVisibleRange() {
            if (!chartInstance?.scales.x || totalRecords <= 0) return;
            const visibleMin = Math.max(0, Math.floor(chartInstance.scales.x.min));
            const visibleMax = Math.min(
                totalRecords - 1,
                Math.ceil(chartInstance.scales.x.max)
            );
            const visibleCount = Math.max(1, visibleMax - visibleMin + 1);
            const margin = Math.max(50, visibleCount);
            const wantedStart = Math.max(0, visibleMin - margin);
            const wantedEnd = Math.min(totalRecords, visibleMax + margin + 1);
            const safeStart = loadedStart + Math.floor(margin / 3);
            const safeEnd = loadedEnd - Math.floor(margin / 3);
            if (visibleMin >= safeStart && visibleMax < safeEnd) return;

            const requestId = ++rangeRequestId;
            try {
                const range = await requestRange(
                    wantedStart,
                    Math.min(5000, wantedEnd - wantedStart)
                );
                if (requestId !== rangeRequestId || !chartInstance) return;

                const xMin = chartInstance.scales.x.min;
                const xMax = chartInstance.scales.x.max;
                const yMin = chartInstance.scales.y.min;
                const yMax = chartInstance.scales.y.max;
                loadedStart = wantedStart;
                loadedEnd = wantedStart + range.rows.length;
                totalRecords = Math.max(totalRecords, Number(range.total) || 0);
                rememberTimes(range.rows);
                const replacement = createDatasets(range.rows);
                chartInstance.data.datasets.forEach((dataset, index) => {
                    dataset.data = replacement[index]?.data || [];
                });
                chartInstance.options.plugins.zoom.limits.x.max =
                    Math.max(totalRecords - 1, 0);
                chartInstance.options.scales.x.min = xMin;
                chartInstance.options.scales.x.max = xMax;
                chartInstance.options.scales.y.min = yMin;
                chartInstance.options.scales.y.max = yMax;
                chartInstance.update('none');
                requestAnimationFrame(syncScrollbarsFromChart);
            } catch (error) {
                console.error('按范围加载温度数据失败', error);
            }
        }

        function appendRealtimeRecord(message) {
            if (!Array.isArray(message.values)) return;
            if (!chartInstance) {
                pendingRealtimeMessages.push(message);
                return;
            }
            const index = Number(message.index);
            if (!Number.isInteger(index) || index < 0) return;

            const xMin = chartInstance.scales.x.min;
            const xMax = chartInstance.scales.x.max;
            const yMin = chartInstance.scales.y.min;
            const yMax = chartInstance.scales.y.max;
            const previousLastIndex = Math.max(totalRecords - 1, 0);
            const wasFollowingLatest =
                totalRecords === 0 || xMax >= previousLastIndex - 0.5;
            const visibleXSpan = xMax - xMin;
            totalRecords = Math.max(totalRecords, Number(message.total) || index + 1);
            chartInstance.options.plugins.zoom.limits.x.max =
                Math.max(totalRecords - 1, 0);

            // 只把邻近当前缓存的实时点加入内存；看其他位置时仍保持按需加载。
            if (index >= loadedStart && index <= loadedEnd) {
                timeByIndex.set(index, message.values[0]);
                temperatureCols.forEach((column, datasetIndex) => {
                    const rawValue = message.values[column.index];
                    const value = rawValue === '' ? NaN : Number(rawValue);
                    const dataset = chartInstance.data.datasets[datasetIndex];
                    if (!dataset) return;
                    const point = {
                        x: index,
                        y: Number.isFinite(value) ? value : null
                    };
                    const existingIndex =
                        dataset.data.findIndex(item => item.x === index);
                    if (existingIndex >= 0) {
                        dataset.data[existingIndex] = point;
                    } else {
                        dataset.data.push(point);
                    }
                });
                loadedEnd = Math.max(loadedEnd, index + 1);
            }

            // 位于最右端时继续跟随最新记录，并保持缩放宽度；
            // 查看历史数据时则完全保留当前位置。
            if (wasFollowingLatest) {
                const latestIndex = Math.max(totalRecords - 1, 0);
                chartInstance.options.scales.x.max = latestIndex;
                chartInstance.options.scales.x.min = Math.max(
                    0,
                    latestIndex - visibleXSpan
                );
            } else {
                chartInstance.options.scales.x.min = xMin;
                chartInstance.options.scales.x.max = xMax;
            }
            chartInstance.options.scales.y.min = yMin;
            chartInstance.options.scales.y.max = yMax;
            chartInstance.update('none');
            requestAnimationFrame(syncScrollbarsFromChart);
        }

        function connectWebSocket() {
            clearTimeout(webSocketReconnectTimer);
            if (webSocket) webSocket.close();
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            webSocket = new WebSocket(`${protocol}//${location.host}/ws`);
            webSocket.addEventListener('message', event => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'record') appendRealtimeRecord(message);
                    if (message.type === 'ready') {
                        totalRecords = Math.max(
                            totalRecords,
                            Number(message.total) || 0
                        );
                        if (chartInstance) {
                            chartInstance.options.plugins.zoom.limits.x.max =
                                Math.max(totalRecords - 1, 0);
                            requestAnimationFrame(syncScrollbarsFromChart);
                        }
                    }
                } catch (error) {
                    console.error('处理实时温度消息失败', error);
                }
            });
            webSocket.addEventListener('close', () => {
                webSocketReconnectTimer = setTimeout(connectWebSocket, 3000);
            });
            webSocket.addEventListener('error', () => webSocket.close());
        }

        let chartInstance = null;
        let autoZoomAxis = 'x';
        let initialTouchGap = null;
        let chartPreferences = null;
        let syncingScrollbars = false;
        let hoveredDatasetIndex = -1;
        const preferenceStorageKey = 'cpuTempChartPreferences';
        const isMobileDevice =
            window.matchMedia('(hover: none) and (pointer: coarse)').matches;

        function getDefaultPreferences() {
            return {
                zoomDirection: isMobileDevice ? 'auto' : 'x',
                showDate: false,
                datasetVisibility: {}
            };
        }

        function loadPreferences() {
            const defaults = getDefaultPreferences();
            try {
                const saved = JSON.parse(localStorage.getItem(preferenceStorageKey));
                if (!saved || typeof saved !== 'object' || Array.isArray(saved)) {
                    return defaults;
                }

                const allowedDirections = isMobileDevice
                    ? ['x', 'y', 'auto', 'none']
                    : ['x', 'y', 'none'];
                const zoomDirection = allowedDirections.includes(saved.zoomDirection)
                    ? saved.zoomDirection
                    : defaults.zoomDirection;
                const showDate = typeof saved.showDate === 'boolean'
                    ? saved.showDate
                    : defaults.showDate;
                const datasetVisibility = {};
                if (
                    saved.datasetVisibility &&
                    typeof saved.datasetVisibility === 'object' &&
                    !Array.isArray(saved.datasetVisibility)
                ) {
                    Object.entries(saved.datasetVisibility).forEach(([label, visible]) => {
                        if (typeof visible === 'boolean') {
                            datasetVisibility[label] = visible;
                        }
                    });
                }

                return {zoomDirection, showDate, datasetVisibility};
            } catch (error) {
                console.warn('读取图表偏好失败，已使用默认设置', error);
                return defaults;
            }
        }

        function savePreferences() {
            try {
                localStorage.setItem(
                    preferenceStorageKey,
                    JSON.stringify(chartPreferences)
                );
            } catch (error) {
                console.warn('保存图表偏好失败', error);
            }
        }

        function saveDatasetVisibility() {
            if (!chartInstance) return;
            const visibility = {};
            chartInstance.data.datasets.forEach((dataset, index) => {
                visibility[dataset.label] = chartInstance.isDatasetVisible(index);
            });
            chartPreferences.datasetVisibility = visibility;
            savePreferences();
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function syncScrollbarsFromChart() {
            if (!chartInstance?.scales.x || !chartInstance?.scales.y) return;

            const horizontal = document.getElementById('horizontalScroll');
            const horizontalSpacer =
                document.getElementById('horizontalScrollSpacer');
            const vertical = document.getElementById('verticalScroll');
            const verticalSpacer = document.getElementById('verticalScrollSpacer');
            const limits = chartInstance.options.plugins.zoom.limits;
            const xScale = chartInstance.scales.x;
            const yScale = chartInstance.scales.y;

            syncingScrollbars = true;

            const totalXSpan = Math.max(limits.x.max - limits.x.min, 0);
            const visibleXSpan = clamp(
                xScale.max - xScale.min,
                Math.min(1, totalXSpan),
                totalXSpan || 1
            );
            const horizontalViewportWidth = horizontal.clientWidth;
            const horizontalContentWidth = totalXSpan > visibleXSpan
                ? horizontalViewportWidth * totalXSpan / visibleXSpan
                : horizontalViewportWidth;
            horizontalSpacer.style.width =
                `${Math.max(horizontalContentWidth, horizontalViewportWidth)}px`;
            horizontalSpacer.style.height = '1px';

            const maxHorizontalScroll =
                Math.max(horizontal.scrollWidth - horizontal.clientWidth, 0);
            const horizontalTravel = Math.max(totalXSpan - visibleXSpan, 0);
            const horizontalRatio = horizontalTravel > 0
                ? clamp((xScale.min - limits.x.min) / horizontalTravel, 0, 1)
                : 0;
            horizontal.scrollLeft = maxHorizontalScroll * horizontalRatio;

            const totalYSpan = Math.max(limits.y.max - limits.y.min, 0);
            const visibleYSpan = clamp(
                yScale.max - yScale.min,
                Math.min(1, totalYSpan),
                totalYSpan || 1
            );
            const verticalViewportHeight = vertical.clientHeight;
            const verticalContentHeight = totalYSpan > visibleYSpan
                ? verticalViewportHeight * totalYSpan / visibleYSpan
                : verticalViewportHeight;
            verticalSpacer.style.height =
                `${Math.max(verticalContentHeight, verticalViewportHeight)}px`;
            verticalSpacer.style.width = '1px';

            const maxVerticalScroll =
                Math.max(vertical.scrollHeight - vertical.clientHeight, 0);
            const verticalTravel = Math.max(totalYSpan - visibleYSpan, 0);
            const verticalRatio = verticalTravel > 0
                ? clamp((limits.y.max - yScale.max) / verticalTravel, 0, 1)
                : 0;
            vertical.scrollTop = maxVerticalScroll * verticalRatio;

            requestAnimationFrame(() => {
                syncingScrollbars = false;
            });
        }

        function updateChartFromHorizontalScroll() {
            if (syncingScrollbars || !chartInstance?.scales.x) return;
            const scrollbar = document.getElementById('horizontalScroll');
            const limits = chartInstance.options.plugins.zoom.limits.x;
            const visibleSpan =
                chartInstance.scales.x.max - chartInstance.scales.x.min;
            const availableDataTravel =
                Math.max((limits.max - limits.min) - visibleSpan, 0);
            const availableScroll =
                Math.max(scrollbar.scrollWidth - scrollbar.clientWidth, 0);
            if (availableDataTravel <= 0 || availableScroll <= 0) return;

            const ratio = clamp(scrollbar.scrollLeft / availableScroll, 0, 1);
            const min = limits.min + availableDataTravel * ratio;
            chartInstance.options.scales.x.min = min;
            chartInstance.options.scales.x.max = min + visibleSpan;
            chartInstance.update('none');
            scheduleVisibleRangeLoad();
        }

        function updateChartFromVerticalScroll() {
            if (syncingScrollbars || !chartInstance?.scales.y) return;
            const scrollbar = document.getElementById('verticalScroll');
            const limits = chartInstance.options.plugins.zoom.limits.y;
            const visibleSpan =
                chartInstance.scales.y.max - chartInstance.scales.y.min;
            const availableDataTravel =
                Math.max((limits.max - limits.min) - visibleSpan, 0);
            const availableScroll =
                Math.max(scrollbar.scrollHeight - scrollbar.clientHeight, 0);
            if (availableDataTravel <= 0 || availableScroll <= 0) return;

            const ratio = clamp(scrollbar.scrollTop / availableScroll, 0, 1);
            const max = limits.max - availableDataTravel * ratio;
            chartInstance.options.scales.y.max = max;
            chartInstance.options.scales.y.min = max - visibleSpan;
            chartInstance.update('none');
        }

        function setupChartScrollbars() {
            document.getElementById('horizontalScroll').addEventListener(
                'scroll',
                updateChartFromHorizontalScroll,
                {passive: true}
            );
            document.getElementById('verticalScroll').addEventListener(
                'scroll',
                updateChartFromVerticalScroll,
                {passive: true}
            );
            window.addEventListener('resize', () => {
                requestAnimationFrame(syncScrollbarsFromChart);
            });
        }

        function getSelectedZoomMode() {
            const direction = document.getElementById('zoomDirection').value;
            if (direction === 'auto') return autoZoomAxis;
            return direction === 'none' ? 'x' : direction;
        }

        function setupMobileAutoZoomOption() {
            if (!isMobileDevice) return;

            const select = document.getElementById('zoomDirection');
            const option = document.createElement('option');
            option.value = 'auto';
            option.textContent = '自动（双指方向）';
            select.insertBefore(option, select.querySelector('option[value="none"]'));
        }

        function applySavedPreferences() {
            document.getElementById('zoomDirection').value =
                chartPreferences.zoomDirection;
            document.getElementById('showDate').checked =
                chartPreferences.showDate;
        }

        function setupTouchDirectionDetection() {
            const canvas = document.getElementById('tempChart');

            canvas.addEventListener('touchstart', event => {
                if (event.touches.length !== 2) {
                    initialTouchGap = null;
                    return;
                }
                initialTouchGap = {
                    x: Math.abs(event.touches[0].clientX - event.touches[1].clientX),
                    y: Math.abs(event.touches[0].clientY - event.touches[1].clientY)
                };
            }, {passive: true});

            canvas.addEventListener('touchmove', event => {
                if (
                    event.touches.length !== 2 ||
                    !initialTouchGap ||
                    document.getElementById('zoomDirection').value !== 'auto'
                ) return;

                const currentGap = {
                    x: Math.abs(event.touches[0].clientX - event.touches[1].clientX),
                    y: Math.abs(event.touches[0].clientY - event.touches[1].clientY)
                };
                const horizontalChange = Math.abs(currentGap.x - initialTouchGap.x);
                const verticalChange = Math.abs(currentGap.y - initialTouchGap.y);

                if (Math.max(horizontalChange, verticalChange) < 4) return;
                autoZoomAxis = horizontalChange >= verticalChange ? 'x' : 'y';
                if (chartInstance) {
                    chartInstance.options.plugins.zoom.zoom.mode = autoZoomAxis;
                }
            }, {passive: true});

            canvas.addEventListener('touchend', event => {
                if (event.touches.length < 2) initialTouchGap = null;
            }, {passive: true});
        }

        function formatTimeLabel(value, includeDate) {
            const text = String(value ?? '').trim();
            const match = text.match(/(?:(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?\s+)?(\d{1,2}:\d{2}:\d{2})/);
            if (!match) return text;
            if (!includeDate || !match[1]) return match[4];
            return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')} ${match[4]}`;
        }

        function updateCoreFilterSummary() {
            const total = chartInstance?.data.datasets.length || 0;
            const visible = chartInstance?.data.datasets.filter((_, index) =>
                chartInstance.isDatasetVisible(index)
            ).length || 0;
            document.getElementById('coreFilterSummary').textContent =
                `显示温度（${visible}/${total}）`;
        }

        function getTemperatureRange(datasets, onlyVisible = false) {
            let min = Infinity;
            let max = -Infinity;
            datasets.forEach((dataset, index) => {
                if (onlyVisible && !chartInstance.isDatasetVisible(index)) return;
                dataset.data.forEach(value => {
                    const number = Number(value?.y ?? value);
                    if (!Number.isFinite(number)) return;
                    min = Math.min(min, number);
                    max = Math.max(max, number);
                });
            });

            if (!Number.isFinite(min) || !Number.isFinite(max)) {
                return {min: 0, max: 100};
            }

            min = Math.floor(min);
            max = Math.ceil(max);
            if (min === max) {
                min -= 1;
                max += 1;
            }
            return {min, max};
        }

        function applyVisibleTemperatureRange(updateMode) {
            if (!chartInstance) return;
            const range = getTemperatureRange(chartInstance.data.datasets, true);
            chartInstance.options.scales.y.min = range.min;
            chartInstance.options.scales.y.max = range.max;
            chartInstance.options.plugins.zoom.limits.y.min = range.min;
            chartInstance.options.plugins.zoom.limits.y.max = range.max;
            chartInstance.update(updateMode);
            requestAnimationFrame(syncScrollbarsFromChart);
        }

        function setDatasetVisibility(index, visible) {
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            chartInstance.setDatasetVisibility(index, visible);
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
            saveDatasetVisibility();
        }

        function buildCoreFilter(datasets) {
            const list = document.getElementById('coreOptionList');
            list.replaceChildren();

            datasets.forEach((dataset, index) => {
                const label = document.createElement('label');
                label.className = 'core-option';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                const savedVisibility =
                    chartPreferences.datasetVisibility[dataset.label];
                checkbox.checked = typeof savedVisibility === 'boolean'
                    ? savedVisibility
                    : true;
                checkbox.dataset.datasetIndex = index;
                checkbox.addEventListener('change', () =>
                    setDatasetVisibility(index, checkbox.checked)
                );
                chartInstance.setDatasetVisibility(index, checkbox.checked);

                const color = document.createElement('span');
                color.textContent = '●';
                color.style.color = dataset.borderColor;

                const text = document.createElement('span');
                text.textContent = dataset.label;

                label.append(checkbox, color, text);
                list.appendChild(label);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
        }

        function renderExternalTooltip(context) {
            const {chart, tooltip} = context;
            let element = chart.canvas.parentNode.querySelector('.chart-tooltip');
            if (!element) {
                element = document.createElement('div');
                element.className = 'chart-tooltip';
                chart.canvas.parentNode.appendChild(element);
            }
            if (tooltip.opacity === 0) {
                element.style.opacity = 0;
                return;
            }

            element.replaceChildren();
            const title = document.createElement('div');
            title.className = 'chart-tooltip-title';
            const pointIndex = Math.round(tooltip.dataPoints[0]?.parsed.x ?? 0);
            title.textContent = formatTimeLabel(
                timeByIndex.get(pointIndex) || '',
                document.getElementById('showDate').checked
            );
            element.appendChild(title);

            tooltip.dataPoints.forEach(item => {
                const row = document.createElement('div');
                row.className = 'chart-tooltip-row';
                if (item.datasetIndex === hoveredDatasetIndex) {
                    row.classList.add('is-active');
                }
                const icon = document.createElement('span');
                icon.className = 'chart-tooltip-icon';
                icon.style.backgroundColor = item.dataset.borderColor;
                icon.style.color = item.dataset.borderColor;
                const text = document.createElement('span');
                text.textContent = `${item.dataset.label}: ${item.formattedValue} ℃`;
                row.append(icon, text);
                element.appendChild(row);
            });

            element.style.opacity = 1;
            element.style.left = `${chart.canvas.offsetLeft + tooltip.caretX}px`;
            element.style.top = `${chart.canvas.offsetTop + tooltip.caretY}px`;
        }

        function renderChart(datasets, visiblePointCount){
            const ctx = document.getElementById('tempChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            const temperatureRange = getTemperatureRange(datasets);
            const zoomEnabled =
                document.getElementById('zoomDirection').value !== 'none';
            const initialXMax = Math.max(totalRecords - 1, 0);
            const initialXMin = Math.max(
                0,
                totalRecords - visiblePointCount
            );

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {display:true, text:"温度 ℃", color:"#eee"},
                            min: temperatureRange.min,
                            max: temperatureRange.max,
                            ticks: {color:"#ddd"},
                            grid: {color:"#333"}
                        },
                        x: {
                            type: 'linear',
                            title: {display:true, text:"时间", color:"#eee"},
                            min: initialXMin,
                            max: initialXMax,
                            ticks: {
                                color:"#ddd",
                                maxRotation: 45,
                                minRotation:45,
                                callback: function(value) {
                                    const rawLabel = timeByIndex.get(Math.round(value));
                                    return formatTimeLabel(
                                        rawLabel || '',
                                        document.getElementById('showDate').checked
                                    );
                                }
                            },
                            grid: {color:"#333"}
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: false,
                            external: renderExternalTooltip,
                            mode: 'index',
                            intersect: false
                        },
                        zoom: {
                            onZoom: () => {
                                syncScrollbarsFromChart();
                                scheduleVisibleRangeLoad();
                            },
                            onZoomComplete: () => {
                                syncScrollbarsFromChart();
                                scheduleVisibleRangeLoad();
                            },
                            zoom: {
                                wheel: {
                                    enabled: zoomEnabled,
                                    speed: 0.08
                                },
                                pinch: {
                                    enabled: zoomEnabled
                                },
                                mode: getSelectedZoomMode()
                            },
                            limits: {
                                x: {
                                    min: 0,
                                    max: initialXMax,
                                    minRange: Math.min(5, Math.max(initialXMax, 1))
                                },
                                y: {
                                    min: temperatureRange.min,
                                    max: temperatureRange.max,
                                    minRange: 1
                                }
                            }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    },
                    onHover: (event) => {
                        const nearest = chartInstance.getElementsAtEventForMode(
                            event,
                            'nearest',
                            {intersect: false, axis: 'xy'},
                            false
                        );
                        hoveredDatasetIndex = nearest[0]?.datasetIndex ?? -1;
                    }
                }
            });
            buildCoreFilter(datasets);
            requestAnimationFrame(syncScrollbarsFromChart);
            if (pendingRealtimeMessages.length) {
                const messages = pendingRealtimeMessages;
                pendingRealtimeMessages = [];
                messages.forEach(appendRealtimeRecord);
            }
        }

        document.getElementById('showDate').addEventListener('change', () => {
            chartPreferences.showDate =
                document.getElementById('showDate').checked;
            savePreferences();
            chartInstance?.update();
        });

        document.getElementById('zoomDirection').addEventListener('change', event => {
            chartPreferences.zoomDirection = event.target.value;
            savePreferences();
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            applyVisibleTemperatureRange('none');
            const direction = event.target.value;
            const enabled = direction !== 'none';
            chartInstance.options.plugins.zoom.zoom.wheel.enabled = enabled;
            chartInstance.options.plugins.zoom.zoom.pinch.enabled = enabled;
            chartInstance.options.plugins.zoom.zoom.mode = getSelectedZoomMode();
            chartInstance.update();
        });

        document.getElementById('showAllCores').addEventListener('click', () => {
            chartInstance?.resetZoom('none');
            document.querySelectorAll('#coreOptionList input').forEach((checkbox, index) => {
                checkbox.checked = true;
                chartInstance?.setDatasetVisibility(index, true);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
            saveDatasetVisibility();
        });

        document.getElementById('hideAllCores').addEventListener('click', () => {
            chartInstance?.resetZoom('none');
            document.querySelectorAll('#coreOptionList input').forEach((checkbox, index) => {
                checkbox.checked = false;
                chartInstance?.setDatasetVisibility(index, false);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
            saveDatasetVisibility();
        });

        document.getElementById('tempChart').addEventListener('dblclick', () => {
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            applyVisibleTemperatureRange();
        });

        document.getElementById('refreshData').addEventListener('click', loadData);

        setupMobileAutoZoomOption();
        chartPreferences = loadPreferences();
        applySavedPreferences();
        setupTouchDirectionDetection();
        setupChartScrollbars();

        // 启动历史范围加载和实时连接。
        window.onload = () => {
            loadData();
            connectWebSocket();
        };
    </script>
</body>
</html>
