<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU核心温度曲线监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            color: #eee;
            padding: 20px;
            font-family: system-ui, sans-serif;
        }
        .container {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        #chartWrap {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .chart-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 16px;
            grid-template-rows: 700px 16px;
            width: 100%;
            min-width: 0;
        }
        .horizontal-scroll {
            grid-column: 1;
            grid-row: 2;
            overflow-x: scroll;
            overflow-y: hidden;
        }
        .vertical-scroll {
            grid-column: 2;
            grid-row: 1;
            overflow-x: hidden;
            overflow-y: scroll;
        }
        .scroll-spacer {
            width: 1px;
            height: 1px;
            pointer-events: none;
        }
        .horizontal-scroll,
        .vertical-scroll {
            scrollbar-color: #777 #333;
        }
        h1 {
            font-size: 22px;
        }
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .switch-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .switch-control input {
            width: 17px;
            height: 17px;
            accent-color: #33b5e5;
        }
        .select-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .select-control select {
            padding: 5px 8px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
        }
        .control-button {
            padding: 5px 11px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
        }
        .control-button:disabled {
            opacity: 0.55;
            cursor: wait;
        }
        details.core-filter {
            position: relative;
        }
        details.core-filter > summary {
            padding: 5px 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #242424;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .core-options {
            position: absolute;
            z-index: 10;
            top: calc(100% + 6px);
            right: 0;
            min-width: 150px;
            max-height: 360px;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #242424;
            box-shadow: 0 6px 20px #0009;
        }
        .core-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 7px;
            margin-bottom: 5px;
            border-bottom: 1px solid #444;
        }
        .core-actions button {
            flex: 1;
            padding: 3px 6px;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            cursor: pointer;
        }
        .core-option {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 3px;
            cursor: pointer;
            white-space: nowrap;
        }
        .core-option input {
            accent-color: #33b5e5;
        }
        .zoom-tip {
            color: #aaa;
            white-space: nowrap;
        }
        @media (max-width: 700px) {
            .title-bar {
                align-items: flex-start;
                flex-direction: column;
            }
            .controls {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <h1>CPU核心温度曲线</h1>
        <div class="controls">
            <span class="zoom-tip">滚轮缩放，双击恢复</span>
            <label class="select-control">
                <span>滚轮缩放</span>
                <select id="zoomDirection">
                    <option value="x" selected>横向（时间）</option>
                    <option value="y">竖向（温度）</option>
                    <option value="none">无（关闭）</option>
                </select>
            </label>
            <details class="core-filter">
                <summary id="coreFilterSummary">显示温度</summary>
                <div class="core-options" id="coreOptions">
                    <div class="core-actions">
                        <button type="button" id="showAllCores">全选</button>
                        <button type="button" id="hideAllCores">全不选</button>
                    </div>
                    <div id="coreOptionList"></div>
                </div>
            </details>
            <label class="switch-control">
                <input type="checkbox" id="showDate">
                <span>显示年月日</span>
            </label>
            <button type="button" class="control-button" id="refreshData">刷新</button>
        </div>
    </div>
    <div class="chart-layout">
        <div class="container" id="chartViewport">
            <div id="chartWrap">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
        <div class="vertical-scroll" id="verticalScroll" aria-label="温度范围滚动条">
            <div class="scroll-spacer" id="verticalScrollSpacer"></div>
        </div>
        <div class="horizontal-scroll" id="horizontalScroll" aria-label="时间范围滚动条">
            <div class="scroll-spacer" id="horizontalScrollSpacer"></div>
        </div>
    </div>

    <script>
        // 配色方案，足够多核心使用
        const colorList = [
            '#ff4444','#ffbb33','#00C851','#33b5e5','#aa66cc',
            '#ff8800','#0099cc','#cc0066','#99cc00','#669900',
            '#00cccc','#ff6699','#9966ff','#66ffcc','#ffcc66'
        ];

        async function loadData() {
            const refreshButton = document.getElementById('refreshData');
            refreshButton.disabled = true;
            refreshButton.textContent = '刷新中…';
            try {
                const res = await fetch('/data', {cache: 'no-store'});
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                parseCSV(text);
            } catch (err) {
                console.error("加载/data失败", err);
                alert("无法获取 /data 数据，请检查接口");
            } finally {
                refreshButton.disabled = false;
                refreshButton.textContent = '刷新';
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if(lines.length < 2) return alert("数据为空");

            const header = lines[0].split(',').map(name =>
                name.replace(/^\uFEFF/, '').trim()
            );
            const rows = lines.slice(1);

            // 兼容新格式：
            // 时间,总温度（主温度）,核心1,核心2...
            // 同时兼容旧格式中的“核心1温度”等列名
            const temperatureCols = [];
            header.forEach((name, idx) => {
                if (idx === 0) return;
                const isMainTemperature =
                    name.includes('总温度') || name.includes('主温度');
                const isCoreTemperature = /^核心\s*\d+(?:温度)?$/.test(name);
                if (isMainTemperature || isCoreTemperature) {
                    temperatureCols.push({
                        index: idx,
                        label: isMainTemperature
                            ? '总温度（主温度）'
                            : name.replace(/温度$/, '').replace(/\s+/g, '')
                    });
                }
            });
            console.log("自动识别温度列：", temperatureCols);

            // 组装图表数据
            const datasets = [];
            const timeLabels = [];
            const temperatureDataMap = {};
            temperatureCols.forEach(item => temperatureDataMap[item.label] = []);

            for(const line of rows){
                const cols = line.split(',');
                const timeStr = cols[0];
                timeLabels.push(timeStr);

                for(const item of temperatureCols){
                    const val = parseFloat(cols[item.index]);
                    temperatureDataMap[item.label].push(isNaN(val) ? null : val);
                }
            }

            // 构建Chart数据集
            temperatureCols.forEach((item, idx)=>{
                const color = colorList[idx % colorList.length];
                datasets.push({
                    label: item.label,
                    data: temperatureDataMap[item.label],
                    borderColor: color,
                    backgroundColor: color + '33',
                    borderWidth: 2,
                    pointRadius: 1.5,
                    tension: 0.2,
                    fill: false
                })
            })

            renderChart(timeLabels, datasets);
        }

        let chartInstance = null;
        let autoZoomAxis = 'x';
        let initialTouchGap = null;
        let chartPreferences = null;
        let syncingScrollbars = false;
        const preferenceStorageKey = 'cpuTempChartPreferences';
        const isMobileDevice =
            window.matchMedia('(hover: none) and (pointer: coarse)').matches;

        function getDefaultPreferences() {
            return {
                zoomDirection: isMobileDevice ? 'auto' : 'x',
                showDate: false,
                datasetVisibility: {}
            };
        }

        function loadPreferences() {
            const defaults = getDefaultPreferences();
            try {
                const saved = JSON.parse(localStorage.getItem(preferenceStorageKey));
                if (!saved || typeof saved !== 'object' || Array.isArray(saved)) {
                    return defaults;
                }

                const allowedDirections = isMobileDevice
                    ? ['x', 'y', 'auto', 'none']
                    : ['x', 'y', 'none'];
                const zoomDirection = allowedDirections.includes(saved.zoomDirection)
                    ? saved.zoomDirection
                    : defaults.zoomDirection;
                const showDate = typeof saved.showDate === 'boolean'
                    ? saved.showDate
                    : defaults.showDate;
                const datasetVisibility = {};
                if (
                    saved.datasetVisibility &&
                    typeof saved.datasetVisibility === 'object' &&
                    !Array.isArray(saved.datasetVisibility)
                ) {
                    Object.entries(saved.datasetVisibility).forEach(([label, visible]) => {
                        if (typeof visible === 'boolean') {
                            datasetVisibility[label] = visible;
                        }
                    });
                }

                return {zoomDirection, showDate, datasetVisibility};
            } catch (error) {
                console.warn('读取图表偏好失败，已使用默认设置', error);
                return defaults;
            }
        }

        function savePreferences() {
            try {
                localStorage.setItem(
                    preferenceStorageKey,
                    JSON.stringify(chartPreferences)
                );
            } catch (error) {
                console.warn('保存图表偏好失败', error);
            }
        }

        function saveDatasetVisibility() {
            if (!chartInstance) return;
            const visibility = {};
            chartInstance.data.datasets.forEach((dataset, index) => {
                visibility[dataset.label] = chartInstance.isDatasetVisible(index);
            });
            chartPreferences.datasetVisibility = visibility;
            savePreferences();
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function syncScrollbarsFromChart() {
            if (!chartInstance?.scales.x || !chartInstance?.scales.y) return;

            const horizontal = document.getElementById('horizontalScroll');
            const horizontalSpacer =
                document.getElementById('horizontalScrollSpacer');
            const vertical = document.getElementById('verticalScroll');
            const verticalSpacer = document.getElementById('verticalScrollSpacer');
            const limits = chartInstance.options.plugins.zoom.limits;
            const xScale = chartInstance.scales.x;
            const yScale = chartInstance.scales.y;

            syncingScrollbars = true;

            const totalXSpan = Math.max(limits.x.max - limits.x.min, 0);
            const visibleXSpan = clamp(
                xScale.max - xScale.min,
                Math.min(1, totalXSpan),
                totalXSpan || 1
            );
            const horizontalViewportWidth = horizontal.clientWidth;
            const horizontalContentWidth = totalXSpan > visibleXSpan
                ? horizontalViewportWidth * totalXSpan / visibleXSpan
                : horizontalViewportWidth;
            horizontalSpacer.style.width =
                `${Math.max(horizontalContentWidth, horizontalViewportWidth)}px`;
            horizontalSpacer.style.height = '1px';

            const maxHorizontalScroll =
                Math.max(horizontal.scrollWidth - horizontal.clientWidth, 0);
            const horizontalTravel = Math.max(totalXSpan - visibleXSpan, 0);
            const horizontalRatio = horizontalTravel > 0
                ? clamp((xScale.min - limits.x.min) / horizontalTravel, 0, 1)
                : 0;
            horizontal.scrollLeft = maxHorizontalScroll * horizontalRatio;

            const totalYSpan = Math.max(limits.y.max - limits.y.min, 0);
            const visibleYSpan = clamp(
                yScale.max - yScale.min,
                Math.min(1, totalYSpan),
                totalYSpan || 1
            );
            const verticalViewportHeight = vertical.clientHeight;
            const verticalContentHeight = totalYSpan > visibleYSpan
                ? verticalViewportHeight * totalYSpan / visibleYSpan
                : verticalViewportHeight;
            verticalSpacer.style.height =
                `${Math.max(verticalContentHeight, verticalViewportHeight)}px`;
            verticalSpacer.style.width = '1px';

            const maxVerticalScroll =
                Math.max(vertical.scrollHeight - vertical.clientHeight, 0);
            const verticalTravel = Math.max(totalYSpan - visibleYSpan, 0);
            const verticalRatio = verticalTravel > 0
                ? clamp((limits.y.max - yScale.max) / verticalTravel, 0, 1)
                : 0;
            vertical.scrollTop = maxVerticalScroll * verticalRatio;

            requestAnimationFrame(() => {
                syncingScrollbars = false;
            });
        }

        function updateChartFromHorizontalScroll() {
            if (syncingScrollbars || !chartInstance?.scales.x) return;
            const scrollbar = document.getElementById('horizontalScroll');
            const limits = chartInstance.options.plugins.zoom.limits.x;
            const visibleSpan =
                chartInstance.scales.x.max - chartInstance.scales.x.min;
            const availableDataTravel =
                Math.max((limits.max - limits.min) - visibleSpan, 0);
            const availableScroll =
                Math.max(scrollbar.scrollWidth - scrollbar.clientWidth, 0);
            if (availableDataTravel <= 0 || availableScroll <= 0) return;

            const ratio = clamp(scrollbar.scrollLeft / availableScroll, 0, 1);
            const min = limits.min + availableDataTravel * ratio;
            chartInstance.options.scales.x.min = min;
            chartInstance.options.scales.x.max = min + visibleSpan;
            chartInstance.update('none');
        }

        function updateChartFromVerticalScroll() {
            if (syncingScrollbars || !chartInstance?.scales.y) return;
            const scrollbar = document.getElementById('verticalScroll');
            const limits = chartInstance.options.plugins.zoom.limits.y;
            const visibleSpan =
                chartInstance.scales.y.max - chartInstance.scales.y.min;
            const availableDataTravel =
                Math.max((limits.max - limits.min) - visibleSpan, 0);
            const availableScroll =
                Math.max(scrollbar.scrollHeight - scrollbar.clientHeight, 0);
            if (availableDataTravel <= 0 || availableScroll <= 0) return;

            const ratio = clamp(scrollbar.scrollTop / availableScroll, 0, 1);
            const max = limits.max - availableDataTravel * ratio;
            chartInstance.options.scales.y.max = max;
            chartInstance.options.scales.y.min = max - visibleSpan;
            chartInstance.update('none');
        }

        function setupChartScrollbars() {
            document.getElementById('horizontalScroll').addEventListener(
                'scroll',
                updateChartFromHorizontalScroll,
                {passive: true}
            );
            document.getElementById('verticalScroll').addEventListener(
                'scroll',
                updateChartFromVerticalScroll,
                {passive: true}
            );
            window.addEventListener('resize', () => {
                requestAnimationFrame(syncScrollbarsFromChart);
            });
        }

        function getSelectedZoomMode() {
            const direction = document.getElementById('zoomDirection').value;
            if (direction === 'auto') return autoZoomAxis;
            return direction === 'none' ? 'x' : direction;
        }

        function setupMobileAutoZoomOption() {
            if (!isMobileDevice) return;

            const select = document.getElementById('zoomDirection');
            const option = document.createElement('option');
            option.value = 'auto';
            option.textContent = '自动（双指方向）';
            select.insertBefore(option, select.querySelector('option[value="none"]'));
        }

        function applySavedPreferences() {
            document.getElementById('zoomDirection').value =
                chartPreferences.zoomDirection;
            document.getElementById('showDate').checked =
                chartPreferences.showDate;
        }

        function setupTouchDirectionDetection() {
            const canvas = document.getElementById('tempChart');

            canvas.addEventListener('touchstart', event => {
                if (event.touches.length !== 2) {
                    initialTouchGap = null;
                    return;
                }
                initialTouchGap = {
                    x: Math.abs(event.touches[0].clientX - event.touches[1].clientX),
                    y: Math.abs(event.touches[0].clientY - event.touches[1].clientY)
                };
            }, {passive: true});

            canvas.addEventListener('touchmove', event => {
                if (
                    event.touches.length !== 2 ||
                    !initialTouchGap ||
                    document.getElementById('zoomDirection').value !== 'auto'
                ) return;

                const currentGap = {
                    x: Math.abs(event.touches[0].clientX - event.touches[1].clientX),
                    y: Math.abs(event.touches[0].clientY - event.touches[1].clientY)
                };
                const horizontalChange = Math.abs(currentGap.x - initialTouchGap.x);
                const verticalChange = Math.abs(currentGap.y - initialTouchGap.y);

                if (Math.max(horizontalChange, verticalChange) < 4) return;
                autoZoomAxis = horizontalChange >= verticalChange ? 'x' : 'y';
                if (chartInstance) {
                    chartInstance.options.plugins.zoom.zoom.mode = autoZoomAxis;
                }
            }, {passive: true});

            canvas.addEventListener('touchend', event => {
                if (event.touches.length < 2) initialTouchGap = null;
            }, {passive: true});
        }

        function formatTimeLabel(value, includeDate) {
            const text = String(value ?? '').trim();
            const match = text.match(/(?:(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?\s+)?(\d{1,2}:\d{2}:\d{2})/);
            if (!match) return text;
            if (!includeDate || !match[1]) return match[4];
            return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')} ${match[4]}`;
        }

        function updateCoreFilterSummary() {
            const total = chartInstance?.data.datasets.length || 0;
            const visible = chartInstance?.data.datasets.filter((_, index) =>
                chartInstance.isDatasetVisible(index)
            ).length || 0;
            document.getElementById('coreFilterSummary').textContent =
                `显示温度（${visible}/${total}）`;
        }

        function getTemperatureRange(datasets, onlyVisible = false) {
            let min = Infinity;
            let max = -Infinity;
            datasets.forEach((dataset, index) => {
                if (onlyVisible && !chartInstance.isDatasetVisible(index)) return;
                dataset.data.forEach(value => {
                    const number = Number(value);
                    if (!Number.isFinite(number)) return;
                    min = Math.min(min, number);
                    max = Math.max(max, number);
                });
            });

            if (!Number.isFinite(min) || !Number.isFinite(max)) {
                return {min: 0, max: 100};
            }

            min = Math.floor(min);
            max = Math.ceil(max);
            if (min === max) {
                min -= 1;
                max += 1;
            }
            return {min, max};
        }

        function applyVisibleTemperatureRange(updateMode) {
            if (!chartInstance) return;
            const range = getTemperatureRange(chartInstance.data.datasets, true);
            chartInstance.options.scales.y.min = range.min;
            chartInstance.options.scales.y.max = range.max;
            chartInstance.options.plugins.zoom.limits.y.min = range.min;
            chartInstance.options.plugins.zoom.limits.y.max = range.max;
            chartInstance.update(updateMode);
            requestAnimationFrame(syncScrollbarsFromChart);
        }

        function setDatasetVisibility(index, visible) {
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            chartInstance.setDatasetVisibility(index, visible);
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
            saveDatasetVisibility();
        }

        function buildCoreFilter(datasets) {
            const list = document.getElementById('coreOptionList');
            list.replaceChildren();

            datasets.forEach((dataset, index) => {
                const label = document.createElement('label');
                label.className = 'core-option';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                const savedVisibility =
                    chartPreferences.datasetVisibility[dataset.label];
                checkbox.checked = typeof savedVisibility === 'boolean'
                    ? savedVisibility
                    : true;
                checkbox.dataset.datasetIndex = index;
                checkbox.addEventListener('change', () =>
                    setDatasetVisibility(index, checkbox.checked)
                );
                chartInstance.setDatasetVisibility(index, checkbox.checked);

                const color = document.createElement('span');
                color.textContent = '●';
                color.style.color = dataset.borderColor;

                const text = document.createElement('span');
                text.textContent = dataset.label;

                label.append(checkbox, color, text);
                list.appendChild(label);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
        }

        function renderChart(labels, datasets){
            const ctx = document.getElementById('tempChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            const temperatureRange = getTemperatureRange(datasets);
            const zoomEnabled =
                document.getElementById('zoomDirection').value !== 'none';
            const pointCount = labels.length;
            const viewportWidth =
                document.getElementById('chartViewport').clientWidth ||
                window.innerWidth;
            const visiblePointCount = Math.max(
                12,
                Math.floor(viewportWidth / 22)
            );
            const initialXMax = Math.max(pointCount - 1, 0);
            const initialXMin = Math.max(
                0,
                pointCount - visiblePointCount
            );

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {display:true, text:"温度 ℃", color:"#eee"},
                            min: temperatureRange.min,
                            max: temperatureRange.max,
                            ticks: {color:"#ddd"},
                            grid: {color:"#333"}
                        },
                        x: {
                            title: {display:true, text:"时间", color:"#eee"},
                            min: initialXMin,
                            max: initialXMax,
                            ticks: {
                                color:"#ddd",
                                maxRotation: 45,
                                minRotation:45,
                                callback: function(value) {
                                    const rawLabel = this.getLabelForValue(value);
                                    return formatTimeLabel(
                                        rawLabel,
                                        document.getElementById('showDate').checked
                                    );
                                }
                            },
                            grid: {color:"#333"}
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: function(items) {
                                    if (!items.length) return '';
                                    return formatTimeLabel(
                                        items[0].label,
                                        document.getElementById('showDate').checked
                                    );
                                }
                            }
                        },
                        zoom: {
                            onZoom: syncScrollbarsFromChart,
                            onZoomComplete: syncScrollbarsFromChart,
                            zoom: {
                                wheel: {
                                    enabled: zoomEnabled,
                                    speed: 0.08
                                },
                                pinch: {
                                    enabled: zoomEnabled
                                },
                                mode: getSelectedZoomMode()
                            },
                            limits: {
                                x: {
                                    min: 0,
                                    max: initialXMax,
                                    minRange: Math.min(5, Math.max(initialXMax, 1))
                                },
                                y: {
                                    min: temperatureRange.min,
                                    max: temperatureRange.max,
                                    minRange: 1
                                }
                            }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
            buildCoreFilter(datasets);
            requestAnimationFrame(syncScrollbarsFromChart);
        }

        document.getElementById('showDate').addEventListener('change', () => {
            chartPreferences.showDate =
                document.getElementById('showDate').checked;
            savePreferences();
            chartInstance?.update();
        });

        document.getElementById('zoomDirection').addEventListener('change', event => {
            chartPreferences.zoomDirection = event.target.value;
            savePreferences();
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            applyVisibleTemperatureRange('none');
            const direction = event.target.value;
            const enabled = direction !== 'none';
            chartInstance.options.plugins.zoom.zoom.wheel.enabled = enabled;
            chartInstance.options.plugins.zoom.zoom.pinch.enabled = enabled;
            chartInstance.options.plugins.zoom.zoom.mode = getSelectedZoomMode();
            chartInstance.update();
        });

        document.getElementById('showAllCores').addEventListener('click', () => {
            chartInstance?.resetZoom('none');
            document.querySelectorAll('#coreOptionList input').forEach((checkbox, index) => {
                checkbox.checked = true;
                chartInstance?.setDatasetVisibility(index, true);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
            saveDatasetVisibility();
        });

        document.getElementById('hideAllCores').addEventListener('click', () => {
            chartInstance?.resetZoom('none');
            document.querySelectorAll('#coreOptionList input').forEach((checkbox, index) => {
                checkbox.checked = false;
                chartInstance?.setDatasetVisibility(index, false);
            });
            applyVisibleTemperatureRange();
            updateCoreFilterSummary();
            saveDatasetVisibility();
        });

        document.getElementById('tempChart').addEventListener('dblclick', () => {
            if (!chartInstance) return;
            chartInstance.resetZoom('none');
            applyVisibleTemperatureRange();
        });

        document.getElementById('refreshData').addEventListener('click', loadData);

        setupMobileAutoZoomOption();
        chartPreferences = loadPreferences();
        applySavedPreferences();
        setupTouchDirectionDetection();
        setupChartScrollbars();

        // 启动加载
        window.onload = loadData;
    </script>
</body>
</html>
