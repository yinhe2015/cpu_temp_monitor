<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU核心温度曲线监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            color: #eee;
            padding: 20px;
            font-family: system-ui, sans-serif;
        }
        .container {
            max-width: 100%;
            overflow-x: auto;
        }
        #chartWrap {
            width: 1600px;
            height: 700px;
            position: relative;
        }
        h1 {
            margin-bottom: 16px;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>CPU核心温度实时曲线</h1>
    <div class="container">
        <div id="chartWrap">
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <script>
        // 配色方案，足够多核心使用
        const colorList = [
            '#ff4444','#ffbb33','#00C851','#33b5e5','#aa66cc',
            '#ff8800','#0099cc','#cc0066','#99cc00','#669900',
            '#00cccc','#ff6699','#9966ff','#66ffcc','#ffcc66'
        ];

        async function loadData() {
            try {
                const res = await fetch('/data');
                const text = await res.text();
                parseCSV(text);
            } catch (err) {
                console.error("加载/data失败", err);
                alert("无法获取 /data 数据，请检查接口");
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if(lines.length < 2) return alert("数据为空");

            const header = lines[0].split(',');
            const rows = lines.slice(1);

            // 自动提取所有核心列
            const coreCols = [];
            header.forEach((name, idx) => {
                if(name.startsWith('核心') && name.includes('温度')){
                    coreCols.push({
                        index: idx,
                        label: name.replace('温度','').trim()
                    });
                }
            });
            const coreCount = coreCols.length;
            console.log("自动识别核心数量：", coreCount, coreCols);

            // 组装图表数据
            const datasets = [];
            const timeLabels = [];
            const coreDataMap = {};
            coreCols.forEach(item=> coreDataMap[item.label] = []);

            for(const line of rows){
                const cols = line.split(',');
                const timeStr = cols[0];
                timeLabels.push(timeStr);

                for(const item of coreCols){
                    const val = parseFloat(cols[item.index]);
                    coreDataMap[item.label].push(isNaN(val)?null:val);
                }
            }

            // 构建Chart数据集
            coreCols.forEach((item, idx)=>{
                const color = colorList[idx % colorList.length];
                datasets.push({
                    label: item.label,
                    data: coreDataMap[item.label],
                    borderColor: color,
                    backgroundColor: color + '33',
                    borderWidth: 2,
                    pointRadius: 1.5,
                    tension: 0.2,
                    fill: false
                })
            })

            renderChart(timeLabels, datasets);
        }

        let chartInstance = null;
        function renderChart(labels, datasets){
            const ctx = document.getElementById('tempChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {display:true, text:"温度 ℃", color:"#eee"},
                            min: 0,
                            max: 100,
                            ticks: {color:"#ddd"},
                            grid: {color:"#333"}
                        },
                        x: {
                            title: {display:true, text:"时间", color:"#eee"},
                            ticks: {
                                color:"#ddd",
                                maxRotation: 45,
                                minRotation:45
                            },
                            grid: {color:"#333"}
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {color:"#eee", padding:15}
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        // 启动加载
        window.onload = loadData;
    </script>
</body>
</html>
